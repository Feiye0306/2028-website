<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2028 學測陪跑 ｜ 負責人雲端線上控制台</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; padding-bottom: 80px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    /* 頂部控制列 */
    .header-bar {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .header-title h1 { font-size: 1.25rem; font-weight: 800; color: #fff; }
    .header-title p { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    
    .btn {
      background: var(--primary); color: white; border: none; padding: 9px 18px;
      border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none; transition: opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-success { background: #059669; }
    .btn-danger { background: #dc2626; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
    
    /* 說明會開放開關 (Gate) 核心卡片 */
    .gate-card {
      background: var(--card-bg); border-radius: 16px; border: 2px solid var(--border);
      padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: border-color 0.3s;
    }
    .gate-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .gate-status-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px;
      font-size: 0.86rem; font-weight: 800;
    }
    .pill-locked { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .pill-opened { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
    
    .gate-btn {
      width: 100%; min-height: 80px; border-radius: 12px; border: none; cursor: pointer;
      font-size: 1.15rem; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: all 0.2s;
    }
    .gate-btn-locked { background: linear-gradient(135deg, #059669, #047857); border: 1.5px solid #34d399; }
    .gate-btn-opened { background: linear-gradient(135deg, #dc2626, #b91c1c); border: 1.5px solid #f87171; }
    
    /* 分頁與排程工作區 */
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; background: var(--card-bg); border: 1px solid var(--border); padding: 10px;
      border-radius: 10px; font-size: 0.9rem; font-weight: 700; color: var(--muted); cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    
    .schedule-panel { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); padding: 16px; margin-bottom: 20px; }
    
    .slot-row {
      display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
      border-bottom: 1px solid #273549; gap: 10px;
    }
    .slot-row:last-child { border-bottom: none; }
    .slot-index { font-weight: 800; color: #60a5fa; min-width: 65px; font-size: 0.9rem; }
    .slot-date { font-size: 0.8rem; color: var(--muted); min-width: 95px; }
    .slot-name { font-weight: 700; flex: 1; font-size: 0.98rem; }
    .slot-meta { font-size: 0.8rem; color: #94a3b8; }
    .slot-actions { display: flex; gap: 4px; }
    
    /* 設定折疊面板 */
    .config-box {
      background: #0f172a; border-radius: 10px; border: 1px dashed var(--border);
      padding: 14px; margin-top: 14px; font-size: 0.82rem;
    }
    .input-field {
      width: 100%; background: #1e293b; border: 1px solid var(--border); color: #fff;
      padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; margin-top: 4px; margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 頂部資訊與快捷跳轉 -->
    <div class="header-bar">
      <div class="header-title">
        <h1>📱 2028 學測陪跑 ｜ 負責人線上控制台</h1>
        <p>雲端獨立管理端・手機可直接調序與開關</p>
      </div>
      <div style="display: flex; gap: 8px;">
        <a href="./" target="_blank" class="btn btn-secondary">
          👀 開啟家長端頁面 ↗
        </a>
      </div>
    </div>

    <!-- 1. 現場開放開關 (Gate) 核心面板 -->
    <div class="gate-card" id="gate-card-box">
      <div class="gate-header">
        <span class="gate-status-pill pill-locked" id="gate-badge">
          🔴 說明會進行中（家長端鎖定中）
        </span>
        <span id="gate-sync-time" style="font-size: 0.78rem; color: var(--muted);">前次更新：載入中...</span>
      </div>
      <div id="gate-explain" style="font-size: 0.88rem; color: #cbd5e1; line-height: 1.5;">
        家長目前掃小卡 QR Code 進入，僅能看見 2028 學測倒數與引言；2,178 校系與每週內容<strong>處於遮蔽鎖定狀態</strong>。
      </div>

      <button id="gate-btn" class="gate-btn gate-btn-locked" onclick="toggleGateCloud()">
        🔓 點擊【立即解鎖開放】（家長端即刻顯示內容）
      </button>

      <!-- 授權金鑰設定（抽屜） -->
      <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span id="auth-status-text" style="font-size: 0.78rem; color: var(--muted);">金鑰檢查中...</span>
        <button class="btn btn-sm btn-secondary" onclick="toggleAuthDrawer()" style="padding: 3px 8px; font-size: 0.75rem;">
          ⚙️ 金鑰設定 <span id="auth-arrow">▼</span>
        </button>
      </div>
      
      <div id="auth-drawer" class="config-box" style="display: none;">
        <label>GitHub Personal Access Token (需 repo 權限，儲存於本機瀏覽器)：</label>
        <input type="password" id="gh-token-input" class="input-field" placeholder="貼上 GitHub Token (如 ghp_...)">
        <button class="btn btn-sm btn-success" onclick="saveTokenManual()">儲存金鑰</button>
      </div>
    </div>

    <!-- 2. 排程發布順序調控 (Schedule Studio) -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-w" onclick="switchTab('w')">
        🎓 週末主打順序 (126 格)
      </button>
      <button class="tab-btn" id="tab-btn-q" onclick="switchTab('q')">
        🌱 週四問題排程 (64 期)
      </button>
    </div>

    <div class="schedule-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
        <span style="font-size: 0.84rem; color: var(--muted);" id="panel-tip">
          點擊「▲ 上移」或「▼ 下移」可直接調動週末發布順序
        </span>
        <button class="btn btn-sm btn-success" id="btn-save-schedule" onclick="saveScheduleCloud()">
          💾 儲存並發布排程
        </button>
      </div>

      <!-- 週末主打清單 -->
      <div id="pane-w">
        <div id="weekend-container">載入排程中...</div>
      </div>

      <!-- 週四問題清單 -->
      <div id="pane-q" style="display: none;">
        <div id="thurs-container">載入題目中...</div>
      </div>
    </div>

  </div>

  <script>
    const REPO = 'Feiye0306/2028-website';
    let currentOpen = false;
    let gateSha = null;
    let masterData = null;
    let masterSha = null;
    let feedSha = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. 解析網址 Hash 授權帶入 (#token=...)
      if (window.location.hash) {
        const m = window.location.hash.match(/token=([a-zA-Z0-9_]+)/);
        if (m) {
          localStorage.setItem('gh_gate_token', m[1]);
          history.replaceState(null, '', window.location.pathname);
        }
      }

      const token = localStorage.getItem('gh_gate_token') || '';
      if (token) {
        document.getElementById('gh-token-input').value = token;
        document.getElementById('auth-status-text').textContent = '✅ 已載入 GitHub 授權金鑰';
        document.getElementById('auth-status-text').style.color = '#34d399';
      } else {
        document.getElementById('auth-status-text').textContent = '⚠️ 尚未配置 Token，請點右側設定填入';
        document.getElementById('auth-status-text').style.color = '#f87171';
      }

      // 2. 載入 Gate 與排程資料
      await fetchGateStatus();
      await fetchScheduleData();

      // 每 15 秒同步一次線上 Gate 狀態
      setInterval(fetchGateStatus, 15000);
    });

    function toggleAuthDrawer() {
      const d = document.getElementById('auth-drawer');
      const arrow = document.getElementById('auth-arrow');
      if (d.style.display === 'none') {
        d.style.display = 'block';
        arrow.textContent = '▲';
      } else {
        d.style.display = 'none';
        arrow.textContent = '▼';
      }
    }

    function saveTokenManual() {
      const t = document.getElementById('gh-token-input').value.trim();
      if (!t) return alert('請先輸入 Token！');
      localStorage.setItem('gh_gate_token', t);
      document.getElementById('auth-status-text').textContent = '✅ 已儲存金鑰！';
      document.getElementById('auth-status-text').style.color = '#34d399';
      toggleAuthDrawer();
      alert('授權金鑰已儲存於本機手機瀏覽器！');
    }

    // 取得 Gate 狀態
    async function fetchGateStatus() {
      try {
        const res = await fetch('./data/gate.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          renderGateUI(data.open, data.updated_at);
        }
      } catch (e) {
        console.warn('載入 Gate 失敗:', e);
      }
    }

    function renderGateUI(isOpen, updatedAt) {
      currentOpen = isOpen;
      const box = document.getElementById('gate-card-box');
      const badge = document.getElementById('gate-badge');
      const explain = document.getElementById('gate-explain');
      const btn = document.getElementById('gate-btn');
      const time = document.getElementById('gate-sync-time');

      if (time && updatedAt) time.textContent = '前次狀態變更：' + updatedAt;

      if (isOpen) {
        box.style.borderColor = '#10b981';
        badge.className = 'gate-status-pill pill-opened';
        badge.innerHTML = '🟢 全面開放中（家長端已解鎖）';
        explain.innerHTML = '全站 2,178 校系與每週主打內容已<strong>全面對家長開放</strong>，家長手機掃碼後可完整檢索各校系參採與主打專欄。';
        btn.className = 'gate-btn gate-btn-opened';
        btn.innerHTML = '🔒 點擊【切換回鎖定】（家長端即刻遮蔽）';
      } else {
        box.style.borderColor = '#ef4444';
        badge.className = 'gate-status-pill pill-locked';
        badge.innerHTML = '🔴 說明會進行中（家長端鎖定中）';
        explain.innerHTML = '家長目前掃小卡 QR Code 進入，僅能看見 2028 學測倒數與引言；2,178 校系與每週內容<strong>處於遮蔽保護狀態</strong>。';
        btn.className = 'gate-btn gate-btn-locked';
        btn.innerHTML = '🔓 點擊【立即解鎖開放】（家長端即刻顯示內容）';
      }
    }

    // 雲端直接切換 Gate
    async function toggleGateCloud() {
      const token = localStorage.getItem('gh_gate_token');
      if (!token) {
        alert('請先在下方點擊「⚙️ 金鑰設定」填入 GitHub Token！');
        toggleAuthDrawer();
        return;
      }

      const btn = document.getElementById('gate-btn');
      const origText = btn.innerHTML;
      btn.innerHTML = '⏳ 正在寫入 GitHub 雲端...';
      btn.disabled = true;

      const targetState = !currentOpen;

      try {
        // 1. 取得 gate.json 之最新 SHA
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/gate.json`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        let sha = null;
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const nowStr = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
        const newPayload = {
          open: targetState,
          updated_at: nowStr,
          note: targetState ? "現場開放開關：已全面解鎖" : "現場開放開關：說明會鎖定中"
        };
        const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(newPayload, null, 2))));

        // 2. 寫入 GitHub
        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/gate.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `chore: 手機線上切換開關 open=${targetState} (${nowStr})`,
            content: contentB64,
            sha: sha
          })
        });

        if (putRes.ok) {
          renderGateUI(targetState, nowStr);
          alert(`🎉 已成功切換為【${targetState ? '全面開放' : '鎖定封閉'}】！\n家長端手機頁面將在 30 秒內自動感應切換！`);
        } else {
          const errData = await putRes.json();
          alert('⚠️ 切換失敗：' + errData.message);
        }
      } catch (e) {
        alert('⚠️ 連線異常：' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    // 載入排程資料
    async function fetchScheduleData() {
      try {
        const res = await fetch('./data/master_schedule.json?t=' + Date.now());
        if (res.ok) {
          masterData = await res.json();
          renderWeekendList();
          renderThursList();
        }
      } catch (e) {
        console.warn('載入 master_schedule.json 失敗:', e);
      }
    }

    function switchTab(type) {
      document.getElementById('tab-btn-w').classList.toggle('active', type === 'w');
      document.getElementById('tab-btn-q').classList.toggle('active', type === 'q');
      document.getElementById('pane-w').style.display = type === 'w' ? 'block' : 'none';
      document.getElementById('pane-q').style.display = type === 'q' ? 'block' : 'none';
      document.getElementById('panel-tip').textContent = type === 'w' 
        ? '點擊「▲ 上移」或「▼ 下移」可直接調動週末發布順序' 
        : '點擊「編輯題目」可直接修改各週問題內容';
    }

    function renderWeekendList() {
      if (!masterData) return;
      const c = document.getElementById('weekend-container');
      const items = masterData.weekend_releases;
      c.innerHTML = items.map((it, idx) => `
        <div class="slot-row">
          <div class="slot-index">第 ${it.slot_num} 格</div>
          <div class="slot-date">${it.release_date} (${it.day})</div>
          <div class="slot-name">${it.group_name}</div>
          <div class="slot-meta">${it.schools_count} 校</div>
          <div class="slot-actions">
            <button class="btn btn-sm btn-secondary" onclick="moveWeekend(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button class="btn btn-sm btn-secondary" onclick="moveWeekend(${idx}, 1)" ${idx === items.length - 1 ? 'disabled' : ''}>▼</button>
          </div>
        </div>
      `).join('');
    }

    function moveWeekend(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= masterData.weekend_releases.length) return;
      const a = masterData.weekend_releases[idx];
      const b = masterData.weekend_releases[target];

      const tmpName = a.group_name;
      const tmpSchools = a.schools_count;
      const tmpPrograms = a.programs_count;
      const tmpTag = a.tag;
      const tmpDesc = a.desc;

      a.group_name = b.group_name;
      a.schools_count = b.schools_count;
      a.programs_count = b.programs_count;
      a.tag = b.tag;
      a.desc = b.desc;

      b.group_name = tmpName;
      b.schools_count = tmpSchools;
      b.programs_count = tmpPrograms;
      b.tag = tmpTag;
      b.desc = tmpDesc;

      renderWeekendList();
    }

    function renderThursList() {
      if (!masterData) return;
      const c = document.getElementById('thurs-container');
      const items = masterData.thursday_releases;
      c.innerHTML = items.map((it, idx) => `
        <div class="slot-row">
          <div class="slot-index">第 ${it.index} 週</div>
          <div class="slot-date">${it.release_date}</div>
          <div class="slot-name" style="font-size: 0.9rem;">${it.question}</div>
          <div class="slot-actions">
            <button class="btn btn-sm btn-secondary" onclick="editThursQ(${idx})">編輯</button>
          </div>
        </div>
      `).join('');
    }

    function editThursQ(idx) {
      const it = masterData.thursday_releases[idx];
      const newQ = prompt(`修改第 ${it.index} 週問題：`, it.question);
      if (newQ && newQ.trim()) {
        it.question = newQ.trim();
        renderThursList();
      }
    }

    // 儲存排程並發布回 GitHub
    async function saveScheduleCloud() {
      const token = localStorage.getItem('gh_gate_token');
      if (!token) {
        alert('請先在上方設定填入 GitHub Token！');
        toggleAuthDrawer();
        return;
      }

      const btn = document.getElementById('btn-save-schedule');
      btn.textContent = '⏳ 正在上傳 GitHub...';
      btn.disabled = true;

      try {
        // 1. 取得 master_schedule.json SHA
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/master_schedule.json`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        let sha = null;
        if (getRes.ok) {
          const d = await getRes.json();
          sha = d.sha;
        }

        const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(masterData, null, 2))));
        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/master_schedule.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `chore: 手機線上更新排程順序 (${new Date().toLocaleTimeString()})`,
            content: contentB64,
            sha: sha
          })
        });

        if (putRes.ok) {
          alert('🎉 恭喜！最新排程已成功儲存至 GitHub 雲端！');
        } else {
          const err = await putRes.json();
          alert('⚠️ 儲存失敗：' + err.message);
        }
      } catch (e) {
        alert('⚠️ 連線異常：' + e.message);
      } finally {
        btn.textContent = '💾 儲存並發布排程';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
