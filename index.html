<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>學測作戰地圖</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d2242">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="學測作戰地圖">
  <link rel="stylesheet" href="./style.css?v=2028-v1-hero-countdown">
</head>
<body>

  <!-- 頂部 Header：站名（小） ➔ 倒數（全頁最大主角） ＋ 預估學測日 -->
  <header class="site-header">
    <div class="container">
      
      <!-- 1. 站名（小，放最上面一行，不搶位置） -->
      <div class="site-brand-label">學測作戰地圖</div>
      
      <!-- 2. 全頁最大主角：倒數週數 + 預估學測日 -->
      <div class="countdown-hero-block">
        <div class="countdown-main">
          <span class="countdown-prefix">倒數</span>
          <span class="countdown-big-number" id="weeks-num">63</span>
          <span class="countdown-suffix">週</span>
        </div>
        <div class="countdown-sub-date">
          預估學測日 2028.01.14
        </div>
      </div>

    </div>
  </header>

  <main class="container">

    <!-- 3. 搜尋框 (即時檢索升學問題) -->
    <section class="search-section">
      <div class="search-input-wrap">
        <input 
          type="text" 
          id="faq-search-input" 
          class="search-input" 
          placeholder="搜尋升學問題（如：繁星、英聽、選系、分科...）" 
          oninput="handleSearch(this.value)"
          autocomplete="off"
        />
        <button id="search-clear-btn" class="search-clear-btn" onclick="clearSearch()" style="display: none;">✕</button>
      </div>
      <div id="search-feedback" class="search-feedback-text" style="display: none;"></div>
    </section>

    <!-- 發布週次標頭（搜尋時隱藏，平時顯示：第 1 週・2027.02.04） -->
    <div class="week-header-row" id="week-header-row">
      <span class="week-tag" id="cur-week-tag">第 1 週・2027.02.04</span>
    </div>

    <!-- 4. 首屏問題清單（預設全部收合，點開才看答案，手風琴切換） -->
    <section class="accordion-list" id="faq-accordion-container">
      <p style="padding: 24px 0; color: var(--text-muted);">載入問題清單中...</p>
    </section>

    <!-- 歷史已發布週次回看抽屜（僅在有過往週次時顯示） -->
    <section class="history-drawer-section" id="history-drawer-section" style="display: none;">
      <div class="history-drawer-toggle-row" onclick="toggleHistoryDrawer()">
        <h2 class="history-drawer-heading">已發布週次回看 (<span id="history-count">0</span> 週)</h2>
        <button class="history-drawer-btn" id="drawer-toggle-btn">開啟</button>
      </div>
      <div class="history-drawer-panel" id="history-drawer-panel">
        <div id="history-list-container"></div>
      </div>
    </section>

    <!-- 頁尾 -->
    <footer class="site-footer">
      <p>全台 2,178 個系組全收錄</p>
      <p class="footer-source">資料來源：大學甄選入學委員會、大學考試分發委員會、各大專院校官方簡章。</p>
    </footer>

  </main>

  <script src="./app.js?v=2028-v1-hero-countdown"></script>
</body>
</html>
