<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>學測作戰地圖</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d2242">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="學測作戰地圖">
  <link rel="stylesheet" href="./style.css?v=2028-v1-accordion">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 class="brand-title">學測作戰地圖</h1>
      <div class="countdown-strip">
        <span class="countdown-exam-date">預估學測日 2028.01.14</span>
        <span class="countdown-sep">｜</span>
        <span class="countdown-value">倒數 <strong id="weeks-num">63</strong> 週</span>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- 發布週次標頭（只留：第 1 週・日期，嚴禁任何內部註解） -->
    <div class="week-header-row">
      <span class="week-tag" id="cur-week-tag">第 1 週・2027.02.04</span>
    </div>

    <!-- 首屏問題清單（預設全部收合，點開才看答案，手風琴切換） -->
    <section class="accordion-list" id="faq-accordion-container">
      <p style="padding: 24px 0; color: var(--text-muted);">載入問題清單中...</p>
    </section>

    <!-- 歷史已發布週次回看抽屜（僅在有過往週次時顯示） -->
    <section class="history-drawer-section" id="history-drawer-section" style="display: none;">
      <div class="history-drawer-toggle-row" onclick="toggleHistoryDrawer()">
        <h2 class="history-drawer-heading">已發布週次回看 (<span id="history-count">0</span> 週)</h2>
        <button class="history-drawer-btn" id="drawer-toggle-btn">開啟</button>
      </div>
      <div class="history-drawer-panel" id="history-drawer-panel">
        <div id="history-list-container"></div>
      </div>
    </section>

    <!-- 頁尾 -->
    <footer class="site-footer">
      <p>全台 2,178 個系組全收錄</p>
      <p class="footer-source">資料來源：大學甄選入學委員會、大學考試分發委員會、各大專院校官方簡章。</p>
    </footer>

  </main>

  <script src="./app.js?v=2028-v1-accordion"></script>
</body>
</html>
