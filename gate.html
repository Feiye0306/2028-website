<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>說明會開放中控開關 ｜ 負責人手機專用</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .header {
      text-align: center;
      margin-top: 10px;
    }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .big-toggle-btn {
      width: 100%;
      min-height: 160px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffffff;
      margin: 10px 0;
      padding: 16px;
    }
    .big-toggle-btn:active {
      transform: scale(0.97);
    }
    .btn-closed {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border: 2px solid #ef4444;
    }
    .btn-opened {
      background: linear-gradient(135deg, #059669, #065f46);
      border: 2px solid #34d399;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.86rem;
      font-weight: 700;
      background: #0f172a;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-red { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .dot-green { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .token-section {
      margin-top: 10px;
      font-size: 0.85rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .input-field {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .sub-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .sub-btn:hover { background: #475569; }
    .log-box {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 8px;
      word-break: break-all;
    }
    .notice {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div style="font-size: 0.75rem; color: #38bdf8; font-weight: 700; letter-spacing: 1px;">2028 EXAM COMPANION</div>
      <h1>說明會現場・開放開關</h1>
      <p>單手按鍵切換 ｜ 家長端 30 秒自動無感展開</p>
    </div>

    <!-- 狀態卡片與大開關 -->
    <div class="card" style="text-align: center;">
      <div style="margin-bottom: 14px;">
        <span id="status-pill" class="status-pill">
          <span id="status-dot" class="dot dot-red"></span>
          <span id="status-text">目前狀態：導聆封閉中 (False)</span>
        </span>
      </div>

      <button id="toggle-btn" class="big-toggle-btn btn-closed" onclick="toggleGate()">
        <span id="btn-icon" style="font-size: 2.2rem;">🔒</span>
        <span id="btn-text">點擊立即開放全場</span>
        <span style="font-size: 0.8rem; font-weight: 400; opacity: 0.9;">（說明會尾聲點擊解鎖）</span>
      </button>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <span id="last-sync-time" style="font-size: 0.76rem; color: var(--text-muted);">尚未同步</span>
        <button class="sub-btn" onclick="fetchCurrentGateStatus(true)" style="padding: 4px 10px; font-size: 0.74rem;">手動刷新</button>
      </div>

      <div id="action-msg" class="log-box"></div>
    </div>

    <!-- 設定卡片（可折疊） -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleConfigDrawer()">
        <span style="font-size: 0.86rem; font-weight: 700;">⚙️ 授權金鑰與同步設定</span>
        <span id="config-arrow" style="font-size: 0.8rem; color: var(--text-muted);">展開 ▼</span>
      </div>

      <div id="config-drawer" style="display: none; margin-top: 14px; border-top: 1px solid #334155; padding-top: 12px;">
        <div class="input-group">
          <label>GitHub Personal Access Token (PAT)</label>
          <input type="password" id="gh-token" class="input-field" placeholder="ghp_xxxxxxxxxxxx" onchange="saveConfig()">
          <span style="font-size: 0.72rem; color: #64748b;">需具備 repo 或 contents 寫入權限；儲存於手機端本機快取。</span>
        </div>

        <div class="input-group">
          <label>目標倉庫 (預設 2028-website 與 kanban-flow)</label>
          <input type="text" id="gh-repo" class="input-field" value="Feiye0306/2028-website" onchange="saveConfig()">
        </div>

        <div style="text-align: right;">
          <button class="sub-btn" onclick="saveConfig(true)">儲存設定</button>
        </div>
      </div>
    </div>

    <div class="notice">
      💡 提示：本頁面可加入手機主畫面書籤，免登入一鍵開啟。<br>
      家長端平均在按鈕按下後 15~30 秒內自動無感切換。
    </div>
  </div>

  <script>
    let currentOpen = false;
    let gateSha = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      fetchCurrentGateStatus();
      setInterval(fetchCurrentGateStatus, 10000);
    });

    function loadConfig() {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenFromUrl = urlParams.get('token');
      if (tokenFromUrl) {
        localStorage.setItem('gh_gate_token', tokenFromUrl);
      }
      const savedToken = localStorage.getItem('gh_gate_token') || '';
      document.getElementById('gh-token').value = savedToken;

      const savedRepo = localStorage.getItem('gh_gate_repo') || 'Feiye0306/2028-website';
      document.getElementById('gh-repo').value = savedRepo;
    }

    function saveConfig(alertMsg = false) {
      const t = document.getElementById('gh-token').value.trim();
      const r = document.getElementById('gh-repo').value.trim();
      localStorage.setItem('gh_gate_token', t);
      localStorage.setItem('gh_gate_repo', r);
      if (alertMsg) alert('設定已儲存！');
    }

    function toggleConfigDrawer() {
      const d = document.getElementById('config-drawer');
      const arrow = document.getElementById('config-arrow');
      if (d.style.display === 'none') {
        d.style.display = 'block';
        arrow.textContent = '收合 ▲';
      } else {
        d.style.display = 'none';
        arrow.textContent = '展開 ▼';
      }
    }

    // 取得目前線上狀態
    async function fetchCurrentGateStatus(isManual = false) {
      try {
        const repo = document.getElementById('gh-repo').value.trim() || 'Feiye0306/2028-website';
        const token = document.getElementById('gh-token').value.trim();
        
        // 先從公開靜態檔取得
        const staticRes = await fetch('./data/gate.json?t=' + Date.now()).then(r => r.json()).catch(() => null);
        if (staticRes && typeof staticRes.open === 'boolean') {
          updateUiState(staticRes.open);
        }

        // 若有 token，同步取得 GitHub contents sha，以利後續更新
        if (token) {
          const apiRes = await fetch(`https://api.github.com/repos/${repo}/contents/data/gate.json`, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });
          if (apiRes.ok) {
            const apiData = await apiRes.json();
            gateSha = apiData.sha;
            try {
              const decoded = JSON.parse(decodeURIComponent(escape(atob(apiData.content))));
              updateUiState(decoded.open);
            } catch(e) {}
          }
        }

        document.getElementById('last-sync-time').textContent = '同步於 ' + new Date().toLocaleTimeString();
        if (isManual) setLog('已刷新雲端狀態');
      } catch (err) {
        console.error(err);
      }
    }

    function updateUiState(isOpen) {
      currentOpen = isOpen;
      const dot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const btn = document.getElementById('toggle-btn');
      const btnIcon = document.getElementById('btn-icon');
      const btnText = document.getElementById('btn-text');

      if (isOpen) {
        dot.className = 'dot dot-green';
        statusText.textContent = '目前狀態：已開放全場 (True)';
        btn.className = 'big-toggle-btn btn-opened';
        btnIcon.textContent = '🔓';
        btnText.textContent = '已開放（點擊關閉）';
      } else {
        dot.className = 'dot dot-red';
        statusText.textContent = '目前狀態：導聆封閉中 (False)';
        btn.className = 'big-toggle-btn btn-closed';
        btnIcon.textContent = '🔒';
        btnText.textContent = '點擊立即開放全場';
      }
    }

    // 切換開關寫回 GitHub
    async function toggleGate() {
      const token = document.getElementById('gh-token').value.trim();
      const repo = document.getElementById('gh-repo').value.trim() || 'Feiye0306/2028-website';

      if (!token) {
        alert('請先在下方「授權金鑰與同步設定」填入 GitHub Token！');
        toggleConfigDrawer();
        return;
      }

      const targetState = !currentOpen;
      const btn = document.getElementById('toggle-btn');
      btn.style.opacity = '0.6';
      setLog(`正在寫回 GitHub API，設定為：${targetState}...`);

      try {
        // 先獲取最新 SHA
        let sha = gateSha;
        const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/data/gate.json`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const newContent = {
          open: targetState,
          updated_at: new Date().toISOString(),
          note: targetState ? "說明會尾聲：全場開放" : "說明會開場：封閉導聆"
        };
        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(newContent, null, 2))));

        const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/data/gate.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `chore: set gate open=${targetState} at ${new Date().toLocaleTimeString()}`,
            content: contentBase64,
            sha: sha
          })
        });

        if (putRes.ok) {
          updateUiState(targetState);
          setLog(`✅ 成功切換！線上狀態已設為 ${targetState}。家長端即將自動解鎖！`);
        } else {
          const errData = await putRes.json();
          setLog(`❌ 寫入失敗 (${putRes.status}): ${errData.message}`);
        }
      } catch (e) {
        setLog(`❌ 連線錯誤: ${e.message}`);
      } finally {
        btn.style.opacity = '1';
      }
    }

    function setLog(msg) {
      document.getElementById('action-msg').textContent = msg;
    }
  </script>
</body>
</html>
