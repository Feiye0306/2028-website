name: 🚀 說明會現場一鍵開放開關 (Toggle Gate)

on:
  workflow_dispatch:
    inputs:
      action:
        description: '選擇要切換的狀態'
        required: true
        default: 'open'
        type: choice
        options:
          - 'open (全面開放全站)'
          - 'lock (重新鎖定回導聆)'

jobs:
  toggle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Toggle Gate JSON
        run: |
          python3 -c "
          import json, os
          from datetime import datetime
          
          target_action = '${{ github.event.inputs.action }}'
          is_open = True if 'open' in target_action else False
          
          gate_path = 'data/gate.json'
          now_str = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
          
          payload = {
              'open': is_open,
              'updated_at': now_str,
              'note': '現場開關：' + ('全站全面解鎖' if is_open else '說明會封閉鎖定')
          }
          
          os.makedirs('data', exist_ok=True)
          with open(gate_path, 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              
          print(f'已切換 Gate 為: {is_open}')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gate.json
          git commit -m "chore: 現場 Actions 一鍵切換開放狀態 [${{ github.event.inputs.action }}]" || echo "無變更"
          git push origin main
